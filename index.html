<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F2937">
<title>Licznik Skrzyń</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 10px;
    padding-bottom: 24px;
  }
  h1 { font-size: 17px; text-align: center; margin: 4px 0 12px;
       color: #fff; letter-spacing: 1px; }

  .res-card {
    background: #1e293b; border-radius: 12px;
    padding: 10px 10px 8px; margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }

  .res-header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .res-name {
    font-size: 15px; font-weight: 800; color: #38bdf8;
    flex: 0 0 auto;
  }
  .goal-lbl { font-size: 11px; color: #94a3b8; }
  .goal-lbl b { color: #facc15; }
  .goal-inp {
    width: 46px;
    background: #0f172a; border: 1px solid #334155;
    color: #fff; font-size: 14px;
    padding: 4px 4px; border-radius: 8px;
    font-weight: 700; text-align: center;
    -moz-appearance: textfield;
  }
  .goal-inp::-webkit-outer-spin-button,
  .goal-inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .goal-hint { font-size: 10px; color: #94a3b8; margin-left: auto; }
  .goal-hint b { color: #facc15; }

  .res-progress {
    height: 16px; background: #0f172a; border-radius: 8px;
    overflow: hidden; position: relative; margin-bottom: 8px;
  }
  .res-bar {
    height: 100%; background: linear-gradient(90deg,#22c55e,#16a34a);
    width: 0%; transition: width .3s;
  }
  .res-prog-txt {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    font-variant-numeric: tabular-nums;
  }

  .box-row {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 0; border-bottom: 1px solid #334155;
  }
  .box-row:last-child { border-bottom: none; }
  .bname { font-size: 13px; font-weight: 600; flex: 0 0 auto; }
  .bmult { font-size: 10px; color: #64748b; margin-left: 2px; flex: 1; }

  .mini {
    width: 30px; height: 30px; padding: 0; border-radius: 7px;
    font-size: 17px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; cursor: pointer; border: none;
    transition: transform .08s;
  }
  .mini:active { transform: scale(.9); }
  .minus { background: #ef4444; }
  .plus  { background: #22c55e; }
  .bqty {
    min-width: 26px; text-align: center;
    font-size: 14px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .res-footer {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #94a3b8;
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid #334155;
  }
  .res-footer b { color: #facc15; font-weight: 700; }

  .timer-mini {
    display: flex; align-items: center; gap: 5px;
    margin-top: 6px;
  }
  .timer-btn {
    width: 32px; height: 26px; padding: 0; border-radius: 7px;
    font-size: 13px; font-weight: 700; color: #fff;
    background: #22c55e; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .timer-btn.stop { background: #f59e0b; }
  .timer-btn.reset { background: #475569; }
  .timer-txt {
    flex: 1; font-size: 12px; font-weight: 700; color: #38bdf8;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .timer-prod {
    font-size: 11px; color: #22c55e; font-weight: 700;
    min-width: 44px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<h1>📦 LICZNIK SKRZYŃ</h1>
<div id="resources"></div>

<script>
const RESOURCES = [
  { key: 'skora', name: 'Skóra' },
  { key: 'ruda',  name: 'Ruda'  },
  { key: 'kosci', name: 'Kości' },
  { key: 'heban', name: 'Heban' }
];

const TYPES = [
  { key:'szara',    name:'Szara',    mult:1   },
  { key:'zielona',  name:'Zielona',  mult:4   },
  { key:'niebieska',name:'Niebieska',mult:16  },
  { key:'fioletowa',name:'Fioletowa',mult:64  },
  { key:'zlota',    name:'Złota',    mult:256 }
];

const BASE_HOURS = 3;
const BASE_BOXES = 15;
const BOX_TIME_HOURS = BASE_HOURS / BASE_BOXES;
const GOLDEN_MULT = 256;

function emptyCounts() {
  return { szara:0, zielona:0, niebieska:0, fioletowa:0, zlota:0 };
}
function emptyRes() {
  return { counts: emptyCounts(), goal: 1, timerStart: null };
}

function load() {
  try { return JSON.parse(localStorage.getItem('skrzynie')); } catch(e){ return null; }
}
function save() {
  localStorage.setItem('skrzynie', JSON.stringify(state));
}

let state = load();

if (!state || state.version !== 4) {
  if (state && state.version === 3) {
    state.version = 4;
    delete state.activeRes;
    save();
  } else if (state && state.counts) {
    state = {
      version: 4,
      data: {
        skora: { counts: state.counts, goal: state.goal || 1, timerStart: state.timerStart || null },
        ruda:  emptyRes(),
        kosci: emptyRes(),
        heban: emptyRes()
      }
    };
    save();
  } else {
    state = {
      version: 4,
      data: {
        skora: emptyRes(), ruda: emptyRes(),
        kosci: emptyRes(), heban: emptyRes()
      }
    };
    save();
  }
}

function fmtDHM(hours) {
  const totalMin = Math.round(hours * 60);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  return d + 'd ' + h + 'h ' + m + 'm';
}

function buildCard(res) {
  const data = state.data[res.key];
  const c = data.counts;

  const card = document.createElement('div');
  card.className = 'res-card';
  card.dataset.card = res.key;

  card.innerHTML = `
    <div class="res-header">
      <span class="res-name">${res.name}</span>
      <span class="goal-lbl">Cel:</span>
      <input type="number" class="goal-inp" value="${data.goal}" min="0" step="1" inputmode="numeric" data-res="${res.key}">
      <span class="goal-hint">= <b class="goal-grey">0</b> sz.</span>
    </div>
    <div class="res-progress">
      <div class="res-bar"></div>
      <span class="res-prog-txt"></span>
    </div>
    <div class="box-rows"></div>
    <div class="res-footer">
      <span class="footer-left"></span>
      <span class="footer-right"></span>
    </div>
    <div class="timer-mini">
      <button class="timer-btn" data-timer-start="${res.key}">▶</button>
      <button class="timer-btn reset" data-timer-reset="${res.key}">↺</button>
      <span class="timer-txt" data-timer-txt="${res.key}">00:00:00</span>
      <span class="timer-prod" data-timer-prod="${res.key}"></span>
    </div>
  `;

  const rows = card.querySelector('.box-rows');
  TYPES.forEach(t => {
    const row = document.createElement('div');
    row.className = 'box-row';
    row.innerHTML = `
      <span class="bname">${t.name}</span>
      <span class="bmult">·${t.mult}</span>
      <button class="mini minus" data-res="${res.key}" data-type="${t.key}" data-d="-1">−</button>
      <span class="bqty" data-qty="${t.key}">${c[t.key]}</span>
      <button class="mini plus" data-res="${res.key}" data-type="${t.key}" data-d="1">+</button>
    `;
    rows.appendChild(row);
  });

  return card;
}

function renderAll() {
  const container = document.getElementById('resources');
  container.innerHTML = '';
  RESOURCES.forEach(res => {
    container.appendChild(buildCard(res));
    updateCardProgress(res.key);
  });
  tickTimers();
}

function updateCardProgress(resKey) {
  const card = document.querySelector(`[data-card="${resKey}"]`);
  if (!card) return;
  const data = state.data[resKey];
  const c = data.counts;

  let totalS = 0;
  TYPES.forEach(t => totalS += c[t.key] * t.mult);

  const goalGrey = (data.goal || 0) * GOLDEN_MULT;
  const pct = goalGrey > 0 ? Math.min(100, (totalS/goalGrey)*100) : 0;
  const leftHours = Math.max(0, goalGrey - totalS) * BOX_TIME_HOURS;
  const prodHours = totalS * BOX_TIME_HOURS;

  card.querySelector('.res-bar').style.width = pct + '%';
  card.querySelector('.res-prog-txt').textContent =
    `${pct.toFixed(0)}% · ${totalS}/${goalGrey} sz.`;
  card.querySelector('.goal-grey').textContent = goalGrey;
  card.querySelector('.footer-left').innerHTML =
    `Zostało: <b>${fmtDHM(leftHours)}</b>`;
  card.querySelector('.footer-right').innerHTML =
    `Prod.: <b>${fmtDHM(prodHours)}</b>`;

  TYPES.forEach(t => {
    const q = card.querySelector(`[data-qty="${t.key}"]`);
    if (q) q.textContent = c[t.key];
  });
}

function tickTimers() {
  RESOURCES.forEach(res => {
    const data = state.data[res.key];
    const txt = document.querySelector(`[data-timer-txt="${res.key}"]`);
    const prod = document.querySelector(`[data-timer-prod="${res.key}"]`);
    const btn = document.querySelector(`[data-timer-start="${res.key}"]`);
    if (!txt || !prod) return;

    if (!data.timerStart) {
      txt.textContent = '00:00:00';
      prod.textContent = '';
      if (btn) { btn.textContent = '▶'; btn.classList.remove('stop'); }
      return;
    }

    const diffMs = Date.now() - data.timerStart;
    const totalSec = Math.floor(diffMs / 1000);
    const d = Math.floor(totalSec / 86400);
    const hh = String(Math.floor((totalSec % 86400) / 3600)).padStart(2,'0');
    const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2,'0');
    const ss = String(totalSec % 60).padStart(2,'0');
    const prefix = d > 0 ? d + 'd ' : '';
    txt.textContent = `${prefix}${hh}:${mm}:${ss}`;

    const produced = Math.floor((diffMs / 3600000) / BOX_TIME_HOURS);
    prod.textContent = `${produced} szt`;

    if (btn) { btn.textContent = '⏸'; btn.classList.add('stop'); }
  });
}

document.getElementById('resources').addEventListener('input', e => {
  if (e.target.classList.contains('goal-inp')) {
    const resKey = e.target.dataset.res;
    state.data[resKey].goal = Math.max(0, parseInt(e.target.value) || 0);
    save();
    updateCardProgress(resKey);
  }
});

document.getElementById('resources').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.classList.contains('mini')) {
    const resKey = btn.dataset.res;
    const typeKey = btn.dataset.type;
    const delta = parseInt(btn.dataset.d);
    const data = state.data[resKey];
    data.counts[typeKey] = Math.max(0, data.counts[typeKey] + delta);
    save();
    updateCardProgress(resKey);
  } else if (btn.dataset.timerStart) {
    const resKey = btn.dataset.timerStart;
    const data = state.data[resKey];
    if (data.timerStart) data.timerStart = null;
    else data.timerStart = Date.now();
    save();
    tickTimers();
  } else if (btn.dataset.timerReset) {
    const resKey = btn.dataset.timerReset;
    state.data[resKey].timerStart = null;
    save();
    tickTimers();
  }
});

renderAll();
setInterval(tickTimers, 1000);
</script>
</body>
</html>
