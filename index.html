<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Licznik Skrzyń</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 8px; overflow-x: hidden;
    }
    h1 { font-size: 15px; text-align: center; margin: 4px 0 10px;
         color: #fff; letter-spacing: 1px; }
    .card { background: #1e293b; border-radius: 12px; padding: 8px;
            margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
    .card h2 { font-size: 11px; margin: 0 0 8px; text-transform: uppercase;
               color: #94a3b8; letter-spacing: 1px; font-weight: 700; }
    .box-grid { display: grid;
                grid-template-columns: 22px repeat(5, 1fr);
                gap: 5px 4px; align-items: center; }
    .box-hdr { font-size: 9px; font-weight: 800; text-align: center;
               padding: 4px 1px; color: #38bdf8; background: #0f172a;
               border-radius: 6px; line-height: 1.2;
               display: flex; flex-direction: column;
               align-items: center; gap: 1px; }
    .box-hdr.uniw { color: #fbbf24; background: #422006; font-size: 9px; }
    .chest-cell { display: flex; align-items: center; justify-content: center; }
    .cell-inp { width: 100%; padding: 7px 2px; font-size: 14px;
                font-weight: 800; text-align: center; background: #0f172a;
                color: #fff; border: 1px solid #334155; border-radius: 6px;
                font-family: inherit; -moz-appearance: textfield; }
    .cell-inp:focus { outline: none; border-color: #38bdf8; background: #0b1220; }
    .cell-inp.uniw { color: #fbbf24; border-color: #78350f; }
    .cell-inp.uniw:focus { border-color: #fbbf24; }
    .cell-inp::-webkit-outer-spin-button,
    .cell-inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sub-header { font-size: 10px; color: #fbbf24; text-transform: uppercase;
                  font-weight: 800; letter-spacing: 1px;
                  margin: 10px 0 6px; padding-top: 8px;
                  border-top: 1px solid #334155; }
    .alloc-note { font-size: 9px; color: #64748b; margin-bottom: 6px;
                  font-style: italic; }
    .alloc-row { background: #0f172a; border-radius: 8px;
                 padding: 6px 8px; margin-bottom: 5px; }
    .alloc-head { display: flex; align-items: center; gap: 6px;
                  font-size: 10px; margin-bottom: 4px; }
    .alloc-name { font-weight: 800; color: #fff; font-size: 11px; }
    .alloc-total { color: #94a3b8; margin-left: auto; font-size: 9px;
                   font-weight: 600; }
    .alloc-total .free { color: #22c55e; font-weight: 800; }
    .alloc-dest { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .dest-item { font-size: 9px; color: #64748b; font-weight: 700;
                 text-align: center; padding: 3px 2px; border-radius: 5px;
                 background: #1e293b; display: flex; flex-direction: column;
                 align-items: center; gap: 1px; }
    .dest-item.has { background: #422006; color: #fbbf24; }
    .dest-item b { font-size: 12px; display: block; }
    .goal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .goal-col { text-align: center; }
    .goal-name { font-size: 10px; font-weight: 800; color: #38bdf8;
                 margin-bottom: 3px; display: flex; align-items: center;
                 justify-content: center; gap: 3px; }
    .goal-inp { width: 100%; padding: 6px 2px; font-size: 14px;
                font-weight: 800; text-align: center; background: #0f172a;
                color: #facc15; border: 1px solid #334155; border-radius: 6px;
                font-family: inherit; -moz-appearance: textfield; }
    .goal-inp:focus { outline: none; border-color: #38bdf8; }
    .goal-inp::-webkit-outer-spin-button,
    .goal-inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .goal-bar-wrap { height: 12px; background: #0f172a; border-radius: 6px;
                     overflow: hidden; position: relative; margin-top: 4px; }
    .goal-bar { height: 100%;
                background: linear-gradient(90deg, #22c55e, #16a34a);
                width: 0%; transition: width .3s; }
    .goal-bar.complete {
      background: linear-gradient(90deg, #16a34a, #059669);
    }
    .goal-pct { position: absolute; inset: 0; display: flex;
                align-items: center; justify-content: center;
                font-size: 8px; font-weight: 800; color: #fff;
                text-shadow: 0 1px 2px rgba(0,0,0,.9); }
    .goal-info { font-size: 8px; color: #94a3b8; margin-top: 2px;
                 line-height: 1.4; }
    .total-time-card { text-align: center; padding: 14px 8px; }
    .total-time-card h2 { text-align: center; margin-bottom: 6px; }
    .total-time-val { font-size: 26px; font-weight: 800; color: #38bdf8;
                      letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .total-time-lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .done-badge { display: inline-block; margin-top: 6px; padding: 3px 10px;
                  background: #22c55e; color: #fff; font-size: 11px;
                  font-weight: 800; border-radius: 12px; }
    .icon-wrap { position: relative; display: inline-block;
                 vertical-align: middle; }
    .icon-wrap .svg-fb { position: absolute; inset: 0;
                         display: flex; align-items: center;
                         justify-content: center; }
    .icon-wrap img { position: absolute; inset: 0; width: 100%; height: 100%;
                     object-fit: contain; }
  </style>
</head>
<body>

<h1>📦 LICZNIK SKRZYŃ</h1>

<div class="card">
  <h2>Skrzynie</h2>
  <div class="box-grid" id="boxGrid"></div>
  <div id="allocSection" style="display:none">
    <div class="sub-header">🔄 Automatyczny przydział uniwersalnych</div>
    <div class="alloc-note">Rozdzielane tak, by jak najbliżej osiągnąć cele. Zmień cele lub liczbę uniwersalnych — podgląd zaktualizuje się sam.</div>
    <div id="allocRows"></div>
  </div>
</div>

<div class="card">
  <h2>Cel (złote)</h2>
  <div class="goal-grid" id="goalGrid"></div>
</div>

<div class="card total-time-card">
  <h2>Suma czasu do celu</h2>
  <div class="total-time-val" id="totalTime">0m</div>
  <div class="total-time-lbl">wszystkie zasoby razem</div>
  <div id="totalDone"></div>
</div>

<script>
const RESOURCES = [
  { key: 'skora', name: 'Skóra' },
  { key: 'ruda',  name: 'Ruda'  },
  { key: 'kosci', name: 'Kości' },
  { key: 'heban', name: 'Heban' }
];

const TYPES = [
  { key:'szara',    name:'Szara',    mult:1,   color:'#94a3b8' },
  { key:'zielona',  name:'Zielona',  mult:4,   color:'#22c55e' },
  { key:'niebieska',name:'Niebieska',mult:16,  color:'#3b82f6' },
  { key:'fioletowa',name:'Fioletowa',mult:64,  color:'#a855f7' },
  { key:'zlota',    name:'Złota',    mult:256, color:'#facc15' }
];

const BASE_HOURS = 3;
const BASE_BOXES = 15;
const BOX_TIME_HOURS = BASE_HOURS / BASE_BOXES;
const GOLDEN_MULT = 256;

function chestSVG(color, size) {
  size = size || 20;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;">
    <rect x="2" y="8" width="20" height="13" rx="2" fill="${color}"/>
    <rect x="2" y="8" width="20" height="4.5" rx="2" fill="${color}" opacity="0.55"/>
    <rect x="10" y="8" width="4" height="13" fill="rgba(0,0,0,0.3)"/>
    <rect x="9.4" y="11" width="5.2" height="4.8" rx="0.6" fill="#78350f"/>
    <circle cx="12" cy="13" r="0.9" fill="#fbbf24"/>
    <rect x="11.5" y="13.5" width="1" height="1.2" fill="#fbbf24"/>
    <rect x="2" y="10.2" width="20" height="0.6" fill="rgba(0,0,0,0.25)"/>
  </svg>`;
}

const MATERIAL_SVGS = {
  skora: `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block;">
    <path d="M5 6 Q3 8 4 12 Q4 16 6 18 Q9 20 12 19 Q15 20 18 18 Q20 16 20 12 Q21 8 19 6 Q16 4 12 5 Q8 4 5 6 Z"
      fill="#a16207" stroke="#713f12" stroke-width="0.7"/>
  </svg>`,
  ruda: `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block;">
    <polygon points="5,11 9,5 15,6 18,11 14,17 7,16" fill="#78716c" stroke="#44403c" stroke-width="0.6"/>
    <polygon points="9,4 13,3 15,6 11,8" fill="#a8a29e" stroke="#44403c" stroke-width="0.5"/>
    <circle cx="11" cy="11" r="1.1" fill="#fbbf24"/>
    <circle cx="14" cy="12.5" r="0.8" fill="#fbbf24"/>
  </svg>`,
  kosci: `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block;">
    <line x1="5" y1="8" x2="19" y2="16" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="4.5" cy="6.5" r="2.3" fill="#fef3c7" stroke="#78716c" stroke-width="0.6"/>
    <circle cx="4.5" cy="10.5" r="2.3" fill="#fef3c7" stroke="#78716c" stroke-width="0.6"/>
    <circle cx="19.5" cy="13.5" r="2.3" fill="#fef3c7" stroke="#78716c" stroke-width="0.6"/>
    <circle cx="19.5" cy="17.5" r="2.3" fill="#fef3c7" stroke="#78716c" stroke-width="0.6"/>
  </svg>`,
  heban: `<svg viewBox="0 0 24 24" width="16" height="16" style="display:block;">
    <rect x="3" y="8" width="18" height="8" rx="3" fill="#292524" stroke="#1c1917" stroke-width="0.5"/>
    <ellipse cx="5.5" cy="12" rx="2" ry="4" fill="#44403c"/>
    <ellipse cx="5.5" cy="12" rx="1.2" ry="2.4" fill="#1c1917"/>
  </svg>`
};

// Obrazek z fallbackiem SVG
function iconImg(src, svgFallback, size) {
  return `<span class="icon-wrap" style="width:${size}px;height:${size}px;">
    <span class="svg-fb">${svgFallback}</span>
    <img src="${src}" alt=""
      onload="this.parentNode.querySelector('.svg-fb').style.display='none'"
      onerror="this.remove()">
  </span>`;
}

function chestIcon(t, size) {
  return iconImg(`chest-${t.key}.png`, chestSVG(t.color, size), size);
}

function materialIcon(r, size) {
  return iconImg(`mat-${r.key}.png`, MATERIAL_SVGS[r.key], size);
}

function emptyCounts() { return {szara:0,zielona:0,niebieska:0,fioletowa:0,zlota:0}; }
function emptyRes() { return {counts: emptyCounts(), goal: 1}; }

function load() {
  try { return JSON.parse(localStorage.getItem('skrzynie')); } catch(e){ return null; }
}
function save() { localStorage.setItem('skrzynie', JSON.stringify(state)); }

let state = load();
if (!state || state.version !== 6) {
  let data;
  if (state && state.data) {
    data = state.data;
    RESOURCES.forEach(r => { if (!data[r.key]) data[r.key] = emptyRes(); });
  } else if (state && state.counts) {
    data = {
      skora: { counts: state.counts, goal: state.goal || 1 },
      ruda: emptyRes(), kosci: emptyRes(), heban: emptyRes()
    };
  } else {
    data = { skora: emptyRes(), ruda: emptyRes(), kosci: emptyRes(), heban: emptyRes() };
  }
  const universals = {};
  TYPES.forEach(t => {
    let oldTotal = 0;
    if (state && state.universal && state.universal[t.key]) {
      oldTotal = state.universal[t.key].total || 0;
    } else if (state && state.universals) {
      oldTotal = state.universals[t.key] || 0;
    }
    universals[t.key] = oldTotal;
  });
  state = { version: 6, data, universals };
  save();
}

function fmtDHM(hours) {
  const totalMin = Math.round(hours * 60);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function computeAllocation() {
  const base = {};
  RESOURCES.forEach(r => {
    let sum = 0;
    TYPES.forEach(t => sum += state.data[r.key].counts[t.key] * t.mult);
    base[r.key] = sum;
  });
  const deficits = {};
  RESOURCES.forEach(r => {
    const goalGrey = state.data[r.key].goal * GOLDEN_MULT;
    deficits[r.key] = Math.max(0, goalGrey - base[r.key]);
  });
  const remaining = {};
  TYPES.forEach(t => remaining[t.key] = state.universals[t.key] || 0);
  const alloc = {};
  TYPES.forEach(t => {
    alloc[t.key] = {};
    RESOURCES.forEach(r => alloc[t.key][r.key] = 0);
  });
  const order1 = [...RESOURCES].sort((a, b) => deficits[a.key] - deficits[b.key]);
  for (const r of order1) {
    while (deficits[r.key] > 0) {
      let bestKey = null, bestMult = 0;
      for (const t of TYPES) {
        if (remaining[t.key] > 0 && t.mult <= deficits[r.key] && t.mult > bestMult) {
          bestKey = t.key; bestMult = t.mult;
        }
      }
      if (!bestKey) break;
      remaining[bestKey]--;
      alloc[bestKey][r.key]++;
      deficits[r.key] -= bestMult;
    }
  }
  const order2 = RESOURCES.filter(r => deficits[r.key] > 0)
    .sort((a, b) => deficits[a.key] - deficits[b.key]);
  for (const r of order2) {
    while (deficits[r.key] > 0) {
      let sKey = null, sMult = Infinity;
      for (const t of TYPES) {
        if (remaining[t.key] > 0 && t.mult < sMult) {
          sKey = t.key; sMult = t.mult;
        }
      }
      if (!sKey) break;
      remaining[sKey]--;
      alloc[sKey][r.key]++;
      deficits[r.key] -= sMult;
    }
  }
  const final = {};
  RESOURCES.forEach(r => {
    let sum = base[r.key];
    TYPES.forEach(t => sum += alloc[t.key][r.key] * t.mult);
    final[r.key] = sum;
  });
  return { base, alloc, final, remaining };
}

let lastResult = null;

function buildSkrzynie() {
  const el = document.getElementById('boxGrid');
  let html = '<div></div>';
  RESOURCES.forEach(r => {
    html += `<div class="box-hdr">${materialIcon(r, 16)}<span>${r.name}</span></div>`;
  });
  html += '<div class="box-hdr uniw"><span>Uniw.</span></div>';
  TYPES.forEach(t => {
    html += `<div class="chest-cell">${chestIcon(t, 22)}</div>`;
    RESOURCES.forEach(r => {
      const val = state.data[r.key].counts[t.key];
      html += `<input class="cell-inp" type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*"
        data-res="${r.key}" data-type="${t.key}" value="${val}">`;
    });
    const uVal = state.universals[t.key] || 0;
    html += `<input class="cell-inp uniw" type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*"
      data-uniw="${t.key}" value="${uVal}">`;
  });
  el.innerHTML = html;
}

function buildGoals() {
  const el = document.getElementById('goalGrid');
  let html = '';
  RESOURCES.forEach(r => {
    html += `<div class="goal-col">
      <div class="goal-name">${materialIcon(r, 16)}<span>${r.name}</span></div>
      <input class="goal-inp" type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*"
        data-goal="${r.key}" value="${state.data[r.key].goal}">
      <div class="goal-bar-wrap">
        <div class="goal-bar" data-goalbar="${r.key}"></div>
        <span class="goal-pct" data-goalpct="${r.key}">0%</span>
      </div>
      <div class="goal-info" data-goalinfo="${r.key}">0/256</div>
      <div class="goal-info" data-goaltime="${r.key}"></div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderAlloc(result) {
  const section = document.getElementById('allocSection');
  const rows = document.getElementById('allocRows');
  let html = '';
  let any = false;
  const reversed = [...TYPES].reverse();
  reversed.forEach(t => {
    const total = state.universals[t.key] || 0;
    if (total <= 0) return;
    any = true;
    const used = RESOURCES.reduce((a, r) => a + result.alloc[t.key][r.key], 0);
    const free = total - used;
    const destHtml = RESOURCES.map(r => {
      const n = result.alloc[t.key][r.key];
      return `<div class="dest-item${n > 0 ? ' has' : ''}">
        ${materialIcon(r, 14)}<b>${n}</b>
      </div>`;
    }).join('');
    html += `<div class="alloc-row">
      <div class="alloc-head">
        ${chestIcon(t, 16)}
        <span class="alloc-name">${t.name}</span>
        <span class="alloc-total">${total} szt.${free > 0 ? ` · <span class="free">wolne: ${free}</span>` : ''}</span>
      </div>
      <div class="alloc-dest">${destHtml}</div>
    </div>`;
  });
  rows.innerHTML = html;
  section.style.display = any ? 'block' : 'none';
}

function refreshGoal(resKey) {
  const data = state.data[resKey];
  const total = lastResult.final[resKey];
  const goalGrey = data.goal * GOLDEN_MULT;
  const pct = goalGrey > 0 ? Math.min(100, (total/goalGrey)*100) : 0;
  const left = Math.max(0, goalGrey - total);
  const isComplete = goalGrey > 0 && total >= goalGrey;
  const bar = document.querySelector(`[data-goalbar="${resKey}"]`);
  const pctEl = document.querySelector(`[data-goalpct="${resKey}"]`);
  const infoEl = document.querySelector(`[data-goalinfo="${resKey}"]`);
  const timeEl = document.querySelector(`[data-goaltime="${resKey}"]`);
  if (bar) { bar.style.width = pct + '%'; bar.classList.toggle('complete', isComplete); }
  if (pctEl) pctEl.textContent = pct.toFixed(0) + '%';
  if (infoEl) infoEl.textContent = total + '/' + goalGrey;
  if (timeEl) {
    timeEl.textContent = isComplete ? '✓ gotowe' : '⏳ ' + fmtDHM(left * BOX_TIME_HOURS);
    timeEl.style.color = isComplete ? '#22c55e' : '#94a3b8';
  }
}

function refreshSum() {
  let totalHours = 0;
  RESOURCES.forEach(r => {
    const goalGrey = state.data[r.key].goal * GOLDEN_MULT;
    totalHours += Math.max(0, goalGrey - lastResult.final[r.key]) * BOX_TIME_HOURS;
  });
  document.getElementById('totalTime').textContent = fmtDHM(totalHours);
  const allDone = RESOURCES.every(r => {
    const goalGrey = state.data[r.key].goal * GOLDEN_MULT;
    return goalGrey > 0 && lastResult.final[r.key] >= goalGrey;
  });
  document.getElementById('totalDone').innerHTML =
    allDone ? '<span class="done-badge">✓ WSZYSTKIE CELE OSIĄGNIĘTE</span>' : '';
}

function recalcAll() {
  lastResult = computeAllocation();
  renderAlloc(lastResult);
  RESOURCES.forEach(r => refreshGoal(r.key));
  refreshSum();
}

document.getElementById('boxGrid').addEventListener('input', e => {
  const inp = e.target;
  if (!inp.classList.contains('cell-inp')) return;
  if (inp.dataset.res) {
    state.data[inp.dataset.res].counts[inp.dataset.type] =
      Math.max(0, parseInt(inp.value) || 0);
  } else if (inp.dataset.uniw) {
    state.universals[inp.dataset.uniw] = Math.max(0, parseInt(inp.value) || 0);
  }
  save(); recalcAll();
});

document.getElementById('goalGrid').addEventListener('input', e => {
  const inp = e.target.closest('.goal-inp');
  if (!inp) return;
  state.data[inp.dataset.goal].goal = Math.max(0, parseInt(inp.value) || 0);
  save(); recalcAll();
});

buildSkrzynie();
buildGoals();
recalcAll();
</script>
</body>
</html>
