<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Licznik Skrzyń</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 8px;
      overflow-x: hidden;
    }
    h1 {
      font-size: 15px;
      text-align: center;
      margin: 4px 0 10px;
      color: #fff;
      letter-spacing: 1px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .card h2 {
      font-size: 11px;
      margin: 0 0 8px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .box-grid {
      display: grid;
      grid-template-columns: 16px repeat(4, 1fr);
      gap: 5px 4px;
      align-items: center;
    }
    .box-hdr {
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 3px 0;
      color: #38bdf8;
      background: #0f172a;
      border-radius: 6px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin: 0 auto;
      box-shadow: 0 0 6px rgba(255,255,255,.15);
    }
    .cell-inp {
      width: 100%;
      padding: 7px 2px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 6px;
      font-family: inherit;
      -moz-appearance: textfield;
      transition: border-color .15s;
    }
    .cell-inp:focus {
      outline: none;
      border-color: #38bdf8;
      background: #0b1220;
    }
    .cell-inp::-webkit-outer-spin-button,
    .cell-inp::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .goal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .goal-col { text-align: center; }
    .goal-name {
      font-size: 10px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    .goal-inp {
      width: 100%;
      padding: 6px 2px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      background: #0f172a;
      color: #facc15;
      border: 1px solid #334155;
      border-radius: 6px;
      font-family: inherit;
      -moz-appearance: textfield;
    }
    .goal-inp:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .goal-inp::-webkit-outer-spin-button,
    .goal-inp::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .goal-bar-wrap {
      height: 12px;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      margin-top: 4px;
    }
    .goal-bar {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      width: 0%;
      transition: width .3s;
    }
    .goal-bar.complete {
      background: linear-gradient(90deg, #16a34a, #059669);
    }
    .goal-pct {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
    }
    .goal-info {
      font-size: 8px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.4;
    }
    .total-time-card {
      text-align: center;
      padding: 14px 8px;
    }
    .total-time-card h2 {
      text-align: center;
      margin-bottom: 6px;
    }
    .total-time-val {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    .total-time-lbl {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .done-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      background: #22c55e;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<h1>📦 LICZNIK SKRZYŃ</h1>

<div class="card">
  <h2>Skrzynie</h2>
  <div class="box-grid" id="boxGrid"></div>
</div>

<div class="card">
  <h2>Cel (złote)</h2>
  <div class="goal-grid" id="goalGrid"></div>
</div>

<div class="card total-time-card">
  <h2>Suma czasu do celu</h2>
  <div class="total-time-val" id="totalTime">0m</div>
  <div class="total-time-lbl">wszystkie zasoby razem</div>
  <div id="totalDone"></div>
</div>

<script>
const RESOURCES = [
  { key: 'skora', name: 'Skóra' },
  { key: 'ruda',  name: 'Ruda'  },
  { key: 'kosci', name: 'Kości' },
  { key: 'heban', name: 'Heban' }
];

const TYPES = [
  { key:'szara',    name:'Szara',    mult:1,   color:'#94a3b8' },
  { key:'zielona',  name:'Zielona',  mult:4,   color:'#22c55e' },
  { key:'niebieska',name:'Niebieska',mult:16,  color:'#3b82f6' },
  { key:'fioletowa',name:'Fioletowa',mult:64,  color:'#a855f7' },
  { key:'zlota',    name:'Złota',    mult:256, color:'#facc15' }
];

const BASE_HOURS = 3;
const BASE_BOXES = 15;
const BOX_TIME_HOURS = BASE_HOURS / BASE_BOXES;
const GOLDEN_MULT = 256;

function emptyCounts() { return {szara:0,zielona:0,niebieska:0,fioletowa:0,zlota:0}; }
function emptyRes() { return {counts: emptyCounts(), goal: 1, timerStart: null}; }

function load() {
  try { return JSON.parse(localStorage.getItem('skrzynie')); } catch(e){ return null; }
}
function save() { localStorage.setItem('skrzynie', JSON.stringify(state)); }

let state = load();
if (!state || state.version !== 4) {
  const oldCounts = state && state.counts ? state.counts : null;
  const oldGoal = state && typeof state.goal === 'number' ? state.goal : 1;
  const oldTimer = state && state.timerStart ? state.timerStart : null;
  state = {
    version: 4,
    data: {
      skora: { counts: oldCounts || emptyCounts(), goal: oldGoal, timerStart: oldTimer },
      ruda: emptyRes(),
      kosci: emptyRes(),
      heban: emptyRes()
    }
  };
  save();
}

function fmtDHM(hours) {
  const totalMin = Math.round(hours * 60);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function totalGrey(resKey) {
  const c = state.data[resKey].counts;
  let sum = 0;
  TYPES.forEach(t => sum += c[t.key] * t.mult);
  return sum;
}

function remainingHours(resKey) {
  const data = state.data[resKey];
  const total = totalGrey(resKey);
  const goalGrey = data.goal * GOLDEN_MULT;
  const left = Math.max(0, goalGrey - total);
  return left * BOX_TIME_HOURS;
}

function buildSkrzynie() {
  const el = document.getElementById('boxGrid');
  let html = '<div></div>';
  RESOURCES.forEach(r => {
    html += `<div class="box-hdr">${r.name}</div>`;
  });
  TYPES.forEach(t => {
    html += `<div class="dot" style="background:${t.color}" title="${t.name}"></div>`;
    RESOURCES.forEach(r => {
      const val = state.data[r.key].counts[t.key];
      html += `<input class="cell-inp" type="number" min="0" step="1" inputmode="numeric"
        data-res="${r.key}" data-type="${t.key}" value="${val}">`;
    });
  });
  el.innerHTML = html;
}

function buildGoals() {
  const el = document.getElementById('goalGrid');
  let html = '';
  RESOURCES.forEach(r => {
    html += `<div class="goal-col">
      <div class="goal-name">${r.name}</div>
      <input class="goal-inp" type="number" min="0" step="1" inputmode="numeric"
        data-goal="${r.key}" value="${state.data[r.key].goal}">
      <div class="goal-bar-wrap">
        <div class="goal-bar" data-goalbar="${r.key}"></div>
        <span class="goal-pct" data-goalpct="${r.key}">0%</span>
      </div>
      <div class="goal-info" data-goalinfo="${r.key}">0/256</div>
      <div class="goal-info" data-goaltime="${r.key}"></div>
    </div>`;
  });
  el.innerHTML = html;
}

function refreshGoal(resKey) {
  const data = state.data[resKey];
  const total = totalGrey(resKey);
  const goalGrey = data.goal * GOLDEN_MULT;
  const pct = goalGrey > 0 ? Math.min(100, (total/goalGrey)*100) : 0;
  const left = Math.max(0, goalGrey - total);
  const isComplete = goalGrey > 0 && total >= goalGrey;

  const bar = document.querySelector(`[data-goalbar="${resKey}"]`);
  const pctEl = document.querySelector(`[data-goalpct="${resKey}"]`);
  const infoEl = document.querySelector(`[data-goalinfo="${resKey}"]`);
  const timeEl = document.querySelector(`[data-goaltime="${resKey}"]`);

  if (bar) {
    bar.style.width = pct + '%';
    bar.classList.toggle('complete', isComplete);
  }
  if (pctEl) pctEl.textContent = pct.toFixed(0) + '%';
  if (infoEl) infoEl.textContent = total + '/' + goalGrey;
  if (timeEl) {
    timeEl.textContent = isComplete ? '✓ gotowe' : '⏳ ' + fmtDHM(left * BOX_TIME_HOURS);
    timeEl.style.color = isComplete ? '#22c55e' : '#94a3b8';
  }
}

function refreshSum() {
  let totalHours = 0;
  RESOURCES.forEach(r => totalHours += remainingHours(r.key));

  const val = document.getElementById('totalTime');
  const done = document.getElementById('totalDone');
  val.textContent = fmtDHM(totalHours);

  const allDone = RESOURCES.every(r => {
    const total = totalGrey(r.key);
    const goalGrey = state.data[r.key].goal * GOLDEN_MULT;
    return goalGrey > 0 && total >= goalGrey;
  });

  done.innerHTML = allDone ? '<span class="done-badge">✓ WSZYSTKIE CELE OSIĄGNIĘTE</span>' : '';
}

document.getElementById('boxGrid').addEventListener('input', e => {
  const inp = e.target.closest('.cell-inp');
  if (!inp) return;
  const res = inp.dataset.res;
  const type = inp.dataset.type;
  const val = Math.max(0, parseInt(inp.value) || 0);
  state.data[res].counts[type] = val;
  save();
  refreshGoal(res);
  refreshSum();
});

document.getElementById('goalGrid').addEventListener('input', e => {
  const inp = e.target.closest('.goal-inp');
  if (!inp) return;
  const res = inp.dataset.goal;
  state.data[res].goal = Math.max(0, parseInt(inp.value) || 0);
  save();
  refreshGoal(res);
  refreshSum();
});

buildSkrzynie();
buildGoals();
RESOURCES.forEach(r => refreshGoal(r.key));
refreshSum();
</script>
</body>
</html>
